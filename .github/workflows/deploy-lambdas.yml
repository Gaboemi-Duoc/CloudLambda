name: Deploy CloudLambdas

on:
  push:
    branches: [main]
    paths:
      - 'lambda-*/**'
      - '.github/workflows/deploy-lambdas.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        lambda:
          - lambda-course-service
          - lambda-enrollment-service
          - lambda-task-service
          - lambda-notification-worker
          - lambda-report-generator

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SNS_TOPIC_ARN: ${{ secrets.SNS_TOPIC_ARN }}
      NOTIFICATION_API_KEY: ${{ secrets.NOTIFICATION_API_KEY }}

    defaults:
      run:
        working-directory: ${{ matrix.lambda }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.lambda }}/package-lock.json

      - name: Install deps (prod only)
        run: npm ci --omit=dev

      - name: Build zip
        run: |
          zip -r ../${{ matrix.lambda }}.zip . -x "*.git*" "*.DS_Store*"
          ls -lh ../${{ matrix.lambda }}.zip

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}   # <-- the fix
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to Lambda
        run: |
          aws lambda update-function-code \
            --function-name "${{ matrix.lambda }}" \
            --zip-file "fileb://../${{ matrix.lambda }}.zip"

          aws lambda wait function-updated \
            --function-name "${{ matrix.lambda }}"

      - name: Update Lambda env (Common Vars)
        run: |
          aws lambda update-function-configuration \
            --function-name "${{ matrix.lambda }}" \
            --environment "Variables={DATABASE_URL=${{ env.DATABASE_URL }},SNS_TOPIC_ARN=${{ env.SNS_TOPIC_ARN }},NOTIFICATION_API_KEY=${{ env.NOTIFICATION_API_KEY}}}"