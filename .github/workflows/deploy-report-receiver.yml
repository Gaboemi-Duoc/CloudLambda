name: Deploy ReportReceiverFunction to AWS

on:
  push:
    branches: [main]
    paths:
      - 'lambda-report-receiver/**'
      - '.github/workflows/deploy-report-receiver.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    defaults:
      run:
        working-directory: lambda-report-receiver

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: lambda-report-receiver/package-lock.json

      - name: Install deps (prod only)
        run: npm ci --omit=dev

      - name: Build zip
        run: |
          zip -r ../lambda-report-receiver.zip . -x "*.git*" "*.DS_Store*"
          ls -lh ../lambda-report-receiver.zip

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to Lambda
        run: |
          aws lambda update-function-code \
            --function-name "$ReportReceiverFunction" \
            --zip-file "fileb://../lambda-report-receiver.zip"

          aws lambda wait function-updated \
            --function-name "$ReportReceiverFunction"

      - name: Update Lambda env (DATABASE_URL)
        if: ${{ env.DATABASE_URL != '' }}
        run: |
          aws lambda update-function-configuration \
            --function-name "$ReportReceiverFunction" \
            --environment "Variables={DATABASE_URL=${{ secrets.DATABASE_URL }}}"