name: Deploy ReportSenderFunction to AWS

on:
  push:
    branches: [main]
    paths:
      - 'report-sender/**'
      - '.github/workflows/deploy-report-sender.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SNS_TOPIC_ARN: ${{ vars.SNS_TOPIC_ARN }}
    defaults:
      run:
        working-directory: report-sender

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: report-sender/package-lock.json

      - name: Install deps (prod only)
        run: npm ci --omit=dev

      - name: Build zip
        run: |
          zip -r ../report-sender.zip . -x "*.git*" "*.DS_Store*"
          ls -lh ../report-sender.zip

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to Lambda
        run: |
          aws lambda update-function-code \
            --function-name "ReportSenderFunction" \
            --zip-file "fileb://../report-sender.zip"

          aws lambda wait function-updated \
            --function-name "ReportSenderFunction"

      - name: Update Lambda env (SNS_TOPIC_ARN)
        if: ${{ env.SNS_TOPIC_ARN != '' }}
        run: |
          aws lambda update-function-configuration \
            --function-name "ReportSenderFunction" \
            --environment "Variables={SNS_TOPIC_ARN=${{ vars.SNS_TOPIC_ARN }}}"